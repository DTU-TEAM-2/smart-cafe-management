name: DT2-4 Postman
on:
  pull_request:
    branches: [main, develop, 'release/**']
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'backend/**'
      - 'docs/qa/postman/**'
      - 'scripts/render-customer-menu-postman.py'
      - '.github/workflows/dt2-4-postman.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dt2-4-postman-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  postman:
    name: Customer Menu Postman HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: smart_cafe_postman_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --protocol=TCP --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Prepare isolated test schema and synthetic menu only
        shell: bash
        run: |
          container=$(docker ps -q --filter ancestor=mysql:8.0)
          test "$(docker exec "$container" mysql -uroot -N smart_cafe_postman_test -e 'SELECT DATABASE()')" = smart_cafe_postman_test
          docker exec -i "$container" mysql -uroot smart_cafe_postman_test < backend/src/test/resources/schema.sql
          docker exec -i "$container" mysql -uroot smart_cafe_postman_test < docs/qa/postman/dt2-4-menu-test-fixture.sql
          docker exec -i "$container" mysql -uroot smart_cafe_postman_test < docs/qa/postman/dt2-4-qr-test-fixture.sql
          # Regression for SQL mode used by some deployments; scope is this job's disposable MySQL.
          docker exec "$container" mysql -uroot -e "SET GLOBAL sql_mode = CONCAT(@@GLOBAL.sql_mode, ',NO_BACKSLASH_ESCAPES')"
          test "$(docker exec "$container" mysql -uroot -N -e "SELECT FIND_IN_SET('NO_BACKSLASH_ESCAPES', @@GLOBAL.sql_mode) > 0")" = 1
      - name: Package backend
        working-directory: backend
        run: sh mvnw -B -ntp -DskipTests package
      - name: Start real backend on loopback
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/smart_cafe_postman_test?connectionTimeZone=UTC
          DB_USERNAME: root
          DB_PASSWORD: ''
          SERVER_PORT: '18084'
          # This job imports schema.sql directly into a disposable database without Flyway history.
          SPRING_FLYWAY_ENABLED: 'false'
        shell: bash
        run: |
          mkdir -p backend/target/postman
          java -jar backend/target/smart-cafe-0.0.1-SNAPSHOT.jar --server.address=127.0.0.1 > backend/target/postman/server.log 2>&1 &
          backend_pid=$!
          echo "$backend_pid" > backend/target/postman/server.pid
          startup_diagnostics() {
            # Emit fixed messages only. Spring's exception text can contain private configuration.
            local log=backend/target/postman/server.log
            if grep -Fq 'DATABASE_PREFLIGHT_BLOCKED' "$log"; then
              echo '::error::Database preflight blocked backend startup.'
            elif grep -Eq 'Communications link failure|Access denied for user' "$log"; then
              echo '::error::Backend could not connect to the test database.'
            elif grep -Fq 'Port 18084 was already in use' "$log"; then
              echo '::error::Backend could not bind port 18084.'
            elif grep -Fq 'APPLICATION FAILED TO START' "$log"; then
              echo '::error::Spring Boot reported an application startup failure.'
            fi
          }
          for attempt in $(seq 1 60); do
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              backend_exit=0
              wait "$backend_pid" || backend_exit=$?
              echo "::error::Backend exited before readiness (exit $backend_exit)."
              startup_diagnostics
              exit 1
            fi
            health_status=$(curl --silent --max-time 1 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18084/actuator/health) || health_status=000
            if [ "$health_status" = 200 ] && kill -0 "$backend_pid" 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::Backend health did not reach HTTP 200 (last HTTP status: $health_status)."
          startup_diagnostics
          exit 1
      - name: Run Postman Collection with Newman 6.2.1
        id: newman
        run: >-
          npx --yes newman@6.2.1 run docs/qa/postman/dt2-4-menu-api.postman_collection.json
          -e docs/qa/postman/smart-cafe-local.postman_environment.example.json
          --env-var baseUrl=http://127.0.0.1:18084
          --timeout-request 10000 --timeout 120000
          -r cli,json --reporter-json-export backend/target/postman/newman.json
