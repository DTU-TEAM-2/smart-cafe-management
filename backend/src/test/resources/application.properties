spring.application.name=SmartCafeTest
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://127.0.0.1:3306/smart_cafe_ci_test?connectionTimeZone=UTC}
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.sql.init.mode=never

spring.flyway.enabled=false

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

smartcafe.auth.token-secret=test-secret-key-that-is-at-least-32-bytes-long-for-testing!
smartcafe.auth.token-validity-seconds=3600
smartcafe.auth.otp-validity-seconds=600

menu.images.cloud-name=menu-test
menu.images.api-key=
menu.images.api-secret=
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false
