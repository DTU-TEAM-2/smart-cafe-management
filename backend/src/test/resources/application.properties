spring.application.name=SmartCafeTest
spring.datasource.url=${TEST_DB_URL:${DB_URL:jdbc:mysql://127.0.0.1:3306/smart_cafe_test?connectionTimeZone=UTC}}
spring.datasource.username=${TEST_DB_USERNAME:${DB_USERNAME:cafe_app}}
spring.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD:}}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

smartcafe.auth.token-secret=test-secret-key-that-is-at-least-32-bytes-long-for-testing!
smartcafe.auth.token-validity-seconds=3600
smartcafe.auth.otp-validity-seconds=600
