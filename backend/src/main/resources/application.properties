spring.application.name=SmartCafe
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/smart_cafe?connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=3000
spring.sql.init.mode=never
server.error.include-message=never
server.error.include-stacktrace=never
smartcafe.auth.token-secret=${AUTH_TOKEN_SECRET:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-binding-errors=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
menu.images.cloud-name=${CLOUDINARY_CLOUD_NAME:}
menu.images.api-key=${CLOUDINARY_API_KEY:}
menu.images.api-secret=${CLOUDINARY_API_SECRET:}
