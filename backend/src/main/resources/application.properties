spring.application.name=SmartCafe
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/smart_cafe?connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=3000
spring.sql.init.mode=never
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
server.error.include-message=never
server.error.include-stacktrace=never
smartcafe.auth.token-secret=${AUTH_TOKEN_SECRET:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB
server.error.include-binding-errors=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
menu.images.cloud-name=${CLOUDINARY_CLOUD_NAME:}
menu.images.api-key=${CLOUDINARY_API_KEY:}
menu.images.api-secret=${CLOUDINARY_API_SECRET:}
feedback.firebase.enabled=${FEEDBACK_FIREBASE_ENABLED:false}
feedback.firebase.bucket=${FIREBASE_STORAGE_BUCKET:}
feedback.limits.per-source-per-minute=${FEEDBACK_PER_SOURCE_PER_MINUTE:20}
feedback.limits.total-per-minute=${FEEDBACK_TOTAL_PER_MINUTE:120}
feedback.limits.concurrent-multipart=${FEEDBACK_CONCURRENT_MULTIPART:2}
