spring.application.name=SmartCafe
server.port=${SERVER_PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/smart_cafe?connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME:cafe_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

# Multipart configuration for image uploads (Menu)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Cloudinary menu images
menu.images.cloud-name=${CLOUDINARY_CLOUD_NAME:}
menu.images.api-key=${CLOUDINARY_API_KEY:}
menu.images.api-secret=${CLOUDINARY_API_SECRET:}

# Email configuration for OTP and password recovery
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
smartcafe.mail.from=${SMTP_FROM:${SMTP_USERNAME:}}

# Auth and recovery configuration
smartcafe.auth.token-secret=${AUTH_TOKEN_SECRET:}
smartcafe.auth.token-validity-seconds=${AUTH_TOKEN_VALIDITY_SECONDS:86400}
smartcafe.auth.otp-validity-seconds=${OTP_VALIDITY_SECONDS:600}
smartcafe.auth.pending-registration-validity-seconds=${PENDING_REGISTRATION_VALIDITY_SECONDS:86400}
