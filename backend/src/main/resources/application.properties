spring.application.name=smart-cafe-menu
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
menu.security.issuer=${MENU_JWT_ISSUER:}
menu.security.audience=${MENU_JWT_AUDIENCE:}
menu.images.cloud-name=${CLOUDINARY_CLOUD_NAME:}
menu.images.api-key=${CLOUDINARY_API_KEY:}
menu.images.api-secret=${CLOUDINARY_API_SECRET:}
